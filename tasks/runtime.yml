    def runtime_environment(folder, runtime, parent):
        adapter = runtime["adapter"]
        env = {k: v for k, v in parent.items() if k not in RESET}
        # Also remove all known catalog credential variables and caller-specific overrides.
        for k in list(env):
            if (
                k.startswith("AGENTCFG_")
                or k.endswith(("_AUTH_JSON", "_OAUTH_JSON", "_AUTH_EXPORT_JSON"))
                or k == "AGENT_CONFIG_SPEC"
            ):
                env.pop(k, None)
