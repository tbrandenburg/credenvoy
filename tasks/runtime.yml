    #!/usr/bin/env python3
    """Reference env-to-config renderer. Stages artifacts only; never edits live CLI state."""

    import argparse
    import json
    import os
    import re
    import tempfile
    from pathlib import Path

    NAME = re.compile(r"^[A-Za-z0-9_-]+$")
    ENV = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")


    def env(name):
        if not isinstance(name, str) or not ENV.fullmatch(name):
            raise ValueError("Invalid environment variable name")
        value = os.environ.get(name)
        if not value:
            raise ValueError("Missing environment variable: " + name)
        return value


    def oauth(name):
        try:
            value = json.loads(env(name))
        except json.JSONDecodeError:
            raise ValueError("Invalid OAuth JSON in " + name) from None
        if not isinstance(value, dict) or value.get("type") != "oauth":
            raise ValueError("Expected an OAuth credential object in " + name)
        for field in ("access", "refresh"):
            if not isinstance(value.get(field), str) or not value[field]:
                raise ValueError("Missing OAuth " + field + " in " + name)
        expiry = value.get("expires")
        if isinstance(expiry, bool) or not isinstance(expiry, int) or expiry < 0:
            raise ValueError("Expected nonnegative expires in Unix milliseconds in " + name)
        return value


    def toml_string(value):
        # JSON basic strings are compatible for these string fields; reject controls
        # that JSON can encode with escapes TOML doesn't accept.
        if not isinstance(value, str) or any(ord(c) < 32 for c in value):
            raise ValueError("Invalid TOML string field")
        return json.dumps(value, ensure_ascii=False)


    def render(profile):
        agent, provider = profile["agent"], profile["provider"]
        if not NAME.fullmatch(provider):
            raise ValueError("Invalid provider ID")
        key_name = profile.get("api_key_env")
        oauth_name = profile.get("oauth_json_env")
        github_name = profile.get("github_oauth_env")
        native_name = profile.get("native_auth_json_env")
        if sum(bool(x) for x in (key_name, oauth_name, github_name, native_name)) > 1:
            raise ValueError("Choose one credential source per profile")
        # Validate required env values even when output uses runtime references.
        if key_name:
            env(key_name)
        values = oauth(oauth_name) if oauth_name else profile.get("oauth_value")
        model, base = profile.get("model"), profile.get("base_url")
        files = {}
        runtime = {
            "values": dict(profile.get("env_values", {})),
            "references": dict(profile.get("env", {})),
        }
        for target, value in runtime["values"].items():
            if not ENV.fullmatch(target) or not isinstance(value, str):
                raise ValueError("Invalid literal runtime environment value")
        for target, source in runtime["references"].items():
            if not ENV.fullmatch(target):
                raise ValueError("Invalid target environment variable")
            env(source)
        command = None
        if agent == "opencode-v1":
            if github_name:
                if provider not in ("github-copilot", "github-copilot-enterprise"):
                    raise ValueError("GitHub OAuth bootstrap is Copilot-specific")
                token = env(github_name)
                values = {"type": "oauth", "refresh": token, "access": token, "expires": 0}
                if profile.get("enterprise_domain"):
                    values["enterpriseUrl"] = profile["enterprise_domain"]
            if key_name:
                values = {"type": "api", "key": env(key_name)}
            if values:
                files["auth.json"] = {provider: values}
            config = {}
            if model:
                config["model"] = provider + "/" + model
            if base:
                entry = {"options": {"baseURL": base}}
                packages = {
                    "anthropic-messages": "@ai-sdk/anthropic",
                    "openai-completions": "@ai-sdk/openai-compatible",
                    "openai-responses": "@ai-sdk/openai",
                    "google-generative-ai": "@ai-sdk/google",
                }
                if profile.get("protocol") in packages:
                    entry.update(npm=packages[profile["protocol"]], name=provider)
                    if model:
                        entry["models"] = {model: {"name": model}}
                config["provider"] = {provider: entry}
            files["opencode.json"] = config
            command = ["opencode"]
        elif agent == "opencode-v2":
            if github_name:
                if provider != "github-copilot":
                    raise ValueError("V2 uses github-copilot with enterprise metadata")
                token = env(github_name)
                values = {
                    "type": "oauth",
                    "methodID": "device",
                    "refresh": token,
                    "access": token,
                    "expires": 0,
                }
                if profile.get("enterprise_domain"):
                    values["metadata"] = {"enterpriseUrl": profile["enterprise_domain"]}
            if key_name:
                values = {"type": "key", "key": env(key_name)}
            if values:
                if values["type"] == "oauth" and not values.get("methodID"):
                    raise ValueError("V2 OAuth requires provider-specific methodID")
                if profile.get("metadata"):
                    values["metadata"] = {
                        **values.get("metadata", {}),
                        **profile["metadata"],
                    }
                credential_id = profile.get("credential_id")
                if not credential_id or not NAME.fullmatch(credential_id):
                    raise ValueError("V2 requires a stable credential_id")
                files["credentials.import.json"] = [
                    {
                        "id": credential_id,
                        "integrationID": provider,
                        "label": profile.get("label", "generated"),
                        "active": True,
                        "value": values,
                    }
                ]
            if base:
                package = {
                    "anthropic-messages": "anthropic-compatible",
                    "openai-completions": "openai-compatible",
                    "openai-responses": "openai-compatible/responses",
                    "google-generative-ai": "google",
                }.get(profile.get("protocol"))
                if not package:
                    raise ValueError(
                        "V2 custom endpoint requires an explicit supported protocol"
                    )
                entry = {
                    "name": provider,
                    "package": "@opencode/ai/providers/" + package,
                    "settings": {"baseURL": base},
                }
                if key_name:
                    entry["env"] = [key_name]
                if model:
                    entry["models"] = {model: {"name": model}}
                files["opencode.json"] = {"providers": {provider: entry}}
            # V2 provider/model settings use the current plural providers contract.
            command = ["opencode", "--standalone"]
            if model:
                command += ["--model", provider + "/" + model]
        elif agent == "pi":
            if github_name:
                if provider != "github-copilot":
                    raise ValueError("GitHub token requires github-copilot")
                runtime["references"]["COPILOT_GITHUB_TOKEN"] = github_name
                env(github_name)
            if key_name:
                # Preserve dynamic env resolution rather than serialize the key.
                values = {"type": "api_key", "key": "${" + key_name + "}"}
            if values:
                if profile.get("env"):
                    values["env"] = {k: env(v) for k, v in profile["env"].items()}
                files["auth.json"] = {provider: values}
            if model:
                files["settings.json"] = {
                    "defaultProvider": provider,
                    "defaultModel": model,
                }
            if base:
                entry = {"baseUrl": base}
                if profile.get("dummy_key"):
                    entry["apiKey"] = "local"
                if profile.get("protocol"):
                    entry["api"] = profile["protocol"]
                    if not model:
                        raise ValueError("Custom Pi endpoint requires a model")
                    entry["models"] = [{"id": model}]
                files["models.json"] = {"providers": {provider: entry}}
            command = ["pi"]
        elif agent == "claude":
            if values or github_name:
                raise ValueError("Use Claude's native env or an opaque native auth bundle")
            if (
                provider
                not in ("anthropic", "amazon-bedrock", "google-vertex", "microsoft-foundry")
                and profile.get("protocol") != "anthropic-messages"
            ):
                raise ValueError(
                    "Claude requires a supported cloud integration or Messages endpoint"
                )
            if key_name and provider in (
                "amazon-bedrock",
                "google-vertex",
                "microsoft-foundry",
            ):
                raise ValueError("Use cloud-specific env mappings for cloud credentials")
            if key_name:
                runtime["references"]["ANTHROPIC_API_KEY"] = key_name
            if base:
                runtime["values"]["ANTHROPIC_BASE_URL"] = base
            if model:
                runtime["values"]["ANTHROPIC_MODEL"] = model
            files["settings.json"] = {
                "env": {
                    **runtime["values"],
                    **{
                        target: env(source)
                        for target, source in runtime["references"].items()
                    },
                }
            }
            command = ["claude"]
        elif agent == "codex":
            if values or github_name:
                raise ValueError("Codex requires a native auth bundle for account login")
            lines = []
            if native_name:
                lines.append('cli_auth_credentials_store = "file"')
            if model:
                lines.append("model = " + toml_string(model))
            if profile.get("native_api_key"):
                if provider != "openai" or not key_name:
                    raise ValueError("Native API auth requires openai and an API key")
                files["auth.json"] = {"OPENAI_API_KEY": env(key_name)}
                lines.append('cli_auth_credentials_store = "file"')
            elif provider == "amazon-bedrock" and not base:
                if key_name:
                    raise ValueError("Use AWS_BEARER_TOKEN_BEDROCK via env mapping")
                lines.append('model_provider = "amazon-bedrock"')
            elif base:
                if profile.get("protocol") != "openai-responses":
                    raise ValueError(
                        "Codex custom endpoint requires verified Responses support"
                    )
                lines += [
                    'model_provider = "generated"',
                    "[model_providers.generated]",
                    "name = " + toml_string(provider),
                    "base_url = " + toml_string(base),
                    'wire_api = "responses"',
                    "requires_openai_auth = false",
                ]
                if key_name:
                    if profile.get("api_key_header"):
                        lines += [
                            "[model_providers.generated.env_http_headers]",
                            toml_string(profile["api_key_header"])
                            + " = "
                            + toml_string(key_name),
                        ]
                    else:
                        lines.append("env_key = " + toml_string(key_name))
                if profile.get("query_params"):
                    lines.append("[model_providers.generated.query_params]")
                    lines += [
                        toml_string(k) + " = " + toml_string(v)
                        for k, v in profile["query_params"].items()
                    ]
            elif key_name:
                raise ValueError("Choose native_api_key or a Responses base_url")
            files["config.toml"] = "\n".join(lines) + "\n"
            command = ["codex"]
        elif agent == "copilot":
            if values:
                raise ValueError("Copilot CLI consumes GitHub tokens through native env")
            if github_name:
                env(github_name)
                runtime["references"]["COPILOT_GITHUB_TOKEN"] = github_name
            if key_name:
                runtime["references"]["COPILOT_PROVIDER_API_KEY"] = key_name
            if model:
                runtime["values"]["COPILOT_MODEL"] = model
            if base:
                kind = profile.get("protocol", "openai-completions")
                kinds = {
                    "openai-completions": "openai",
                    "anthropic-messages": "anthropic",
                    "azure": "azure",
                }
                if kind not in kinds or not model:
                    raise ValueError("Copilot BYOK requires supported protocol and model")
                runtime["values"].update(
                    COPILOT_PROVIDER_BASE_URL=base,
                    COPILOT_PROVIDER_TYPE=kinds[kind],
                    COPILOT_MODEL=model,
                )
            elif key_name:
                raise ValueError("Copilot BYOK requires base_url")
            command = ["copilot"]
        else:
            raise ValueError("Unsupported adapter: " + agent)
        export_name = profile.get("auth_export_json_env")
        if export_name:
            if agent != "opencode-v2" or any(
                (key_name, oauth_name, github_name, native_name)
            ):
                raise ValueError(
                    "Native exports require an otherwise credential-free V2 profile"
                )
            exported = json.loads(env(export_name))
            if not isinstance(exported, list) or not exported:
                raise ValueError("OpenCode export must contain an array of credentials")
            for entry in exported:
                if not isinstance(entry, dict) or entry.get("integrationID") != provider:
                    raise ValueError("OpenCode export has a different provider integration")
                if not all(k in entry for k in ("id", "label", "active", "value")):
                    raise ValueError("Incomplete native OpenCode export")
            files["credentials.import.json"] = exported
        if native_name:
            if agent not in ("claude", "codex"):
                raise ValueError(
                    "Native auth bundles are supported only for Claude and Codex"
                )
            try:
                native = json.loads(env(native_name))
            except json.JSONDecodeError:
                raise ValueError("Invalid native auth JSON") from None
            if not isinstance(native, dict) or not native:
                raise ValueError("Native auth bundle must be a nonempty object")
            files[".credentials.json" if agent == "claude" else "auth.json"] = native
        if command:
            if key_name and agent in ("pi", "codex", "opencode-v2"):
                runtime["references"][key_name] = key_name
            runtime["adapter"] = agent
            runtime["command"] = command
            files["runtime.json"] = runtime
        return files


    def stage(spec, output):
        # Validate every profile before writing any file.
        planned = {}
        for profile in spec["profiles"]:
            name = profile["name"]
            if not NAME.fullmatch(name) or name in planned:
                raise ValueError("Invalid or duplicate profile name")
            planned[name] = render(profile)
        output = Path(output)
        if output.exists():
            raise ValueError("Output directory already exists; use a new staging directory")
        output.mkdir(parents=True, mode=0o700)
        for name, files in planned.items():
            folder = output / name
            folder.mkdir(mode=0o700)
            for filename, value in files.items():
                text = (
                    value if isinstance(value, str) else json.dumps(value, indent=2) + "\n"
                )
                fd, tmp = tempfile.mkstemp(dir=folder)
                try:
                    with os.fdopen(fd, "w") as stream:
                        stream.write(text)
                        stream.flush()
                        os.fsync(stream.fileno())
                    os.replace(tmp, folder / filename)
                finally:
                    if os.path.exists(tmp):
                        os.unlink(tmp)
        return sum(len(files) for files in planned.values())


    def main(argv=None):
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--spec", default="profiles.example.json")
        parser.add_argument("--out", default="generated")
        args = parser.parse_args(argv)
        try:
            spec = (
                json.loads(env("AGENT_CONFIG_SPEC"))
                if os.environ.get("AGENT_CONFIG_SPEC")
                else json.loads(Path(args.spec).read_text())
            )
            count = stage(spec, args.out)
        except (ValueError, KeyError, TypeError, OSError):
            # Never echo exception data: it can include secret JSON input.
            parser.exit(
                1,
                "Configuration generation failed; check profile fields, required env vars, and output path.\n",
            )
        print("Staged " + str(count) + " files; credentials were not installed.")


    if __name__ == "__main__":
        main()
