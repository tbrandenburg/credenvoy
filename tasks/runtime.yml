            if args.action == "plan":
                # Run renderer validation, but never print rendered files or secrets.
                for p in spec["profiles"]:
                    files = render.render(p)
                    print(p["name"] + ": " + ", ".join(sorted(files)))
            else:
                n = render.stage(spec, args.out)
                print(
                    "Generated "
                    + str(n)
                    + " files across "
                    + str(len(spec["profiles"]))
                    + " profiles. No live CLI credentials changed."
                )
        except (ConfigError, ValueError, KeyError, TypeError, OSError) as exc:
            message = (
                str(exc)
                if isinstance(exc, ConfigError)
                else "Invalid configuration or environment; no secret values are shown"
            )
            parser.exit(1, message + "\n")


