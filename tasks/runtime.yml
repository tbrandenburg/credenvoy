    def check_version(adapter, executable, env):
        result = subprocess.run(
            [executable, "--version"], env=env, capture_output=True, text=True, check=True
        )
        match = re.search(r"\b(\d+)\.(\d+)\.(\d+)", result.stdout)
        if not match:
            raise ValueError("Cannot identify installed CLI version")
        major, _, _ = map(int, match.groups())
        if adapter == "opencode-v1" and major != 1:
            raise ValueError("Profile requires OpenCode V1")
        if adapter == "opencode-v2" and major != 2:
            raise ValueError("Profile requires OpenCode V2")
        if adapter == "pi" and major < 1:
            raise ValueError("Profile requires current Pi 1.x env-reference syntax")


    def bootstrap(folder, runtime, env):
        adapter = runtime["adapter"]
        if adapter == "opencode-v1" and (folder / "auth.json").exists():
            target = folder / "state/opencode/auth.json"
            if not target.exists():
                target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                with os.fdopen(fd, "wb") as out:
                    out.write((folder / "auth.json").read_bytes())
        if adapter == "opencode-v2" and (folder / "credentials.import.json").exists():
            marker = folder / "state/.credentials-imported"
            if marker.exists():
                return
            help_result = subprocess.run(
                ["opencode", "auth", "import", "--help"],
                env=env,
                capture_output=True,
                text=True,
                check=True,
            )
            if "--standalone" not in help_result.stdout:
                raise ValueError(
                    "Installed OpenCode auth import lacks standalone mode; refusing to target a shared server"
                )
            marker.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
            # Capture import output because third-party error text may include credentials.
            subprocess.run(
                [
                    "opencode",
                    "auth",
                    "import",
                    str(folder / "credentials.import.json"),
                    "--standalone",
                ],
                env=env,
                capture_output=True,
                text=True,
                check=True,
            )
            marker.touch(mode=0o600)


    def main(argv=None):
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--profile", default=os.environ.get("AGENTCFG_PROFILE"))
        parser.add_argument("--out", default=os.environ.get("AGENTCFG_OUTPUT", "generated"))
        parser.add_argument("args", nargs=argparse.REMAINDER)
        args = parser.parse_args(argv)
        try:
            if not args.profile or not configure.render.NAME.fullmatch(args.profile):
                raise ValueError("Set AGENTCFG_PROFILE to a generated profile name")
            root = Path(args.out).resolve()
            folder = root / args.profile
            if folder.is_symlink() or folder.resolve().parent != root:
                raise ValueError("Unsafe profile path")
            runtime = json.loads((folder / "runtime.json").read_text())
            env = runtime_environment(folder, runtime, os.environ)
            command = runtime["command"]
            expected = {
                "claude": "claude",
                "codex": "codex",
                "pi": "pi",
                "copilot": "copilot",
                "opencode-v1": "opencode",
                "opencode-v2": "opencode",
            }
            if command[0] != expected[runtime["adapter"]]:
                raise ValueError("Unexpected CLI command")
            check_version(runtime["adapter"], command[0], env)
            bootstrap(folder, runtime, env)
            extra = args.args[1:] if args.args[:1] == ["--"] else args.args
            os.execvpe(command[0], command + extra, env)
        except (ValueError, KeyError, TypeError, OSError, subprocess.SubprocessError):
            parser.exit(
                1,
                "Cannot launch profile: check CLI version, source env, generated files, and standalone import support. No credential values are shown.\n",
            )


    if __name__ == "__main__":
        main()
