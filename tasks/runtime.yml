    #!/usr/bin/env python3
    """Credenvoy: compile provider/auth/CLI permutations into explicit configuration profiles."""

    import argparse
    import json
    import os
    import re
    from pathlib import Path

    from . import renderer as render

    REGISTRY = globals()["CREDENVOY_REGISTRY"]
    AGENTS = REGISTRY["agents"]
    PROVIDERS = REGISTRY["providers"]


    class ConfigError(ValueError):
        pass


    def token(value):
        return re.sub(r"[^A-Za-z0-9]", "_", value).upper()


    def variable(name):
        if not isinstance(name, str) or not render.ENV.fullmatch(name):
            raise ConfigError("Invalid environment-variable reference")
        return name


    def present(name):
        return bool(os.environ.get(variable(name)))


    def choose(names, required=True):
        names = list(dict.fromkeys(n for n in names if n))
        found = [n for n in names if present(n)]
        if len({os.environ[n] for n in found}) > 1:
            raise ConfigError("Conflicting aliases: " + ", ".join(found))
        if found:
            return found[0]
        if required:
            raise ConfigError("Set one of: " + ", ".join(names))
        return None


    def read(name):
        if not present(name):
            raise ConfigError("Missing environment variable: " + name)
        return os.environ[name]


    def route(agent, provider, auth):
        if agent not in AGENTS or provider not in PROVIDERS:
            raise ConfigError("Unknown agent or provider; add an explicit registry entry")
        p = PROVIDERS[provider]
        if auth not in p["auth_modes"]:
            return "unsupported-auth"
        kind = p["kind"]
        if kind == "chatgpt":
            return (
                "native-bundle"
                if agent in ("codex", "opencode-v1", "opencode-v2", "pi")
                else "unsupported-native"
            )
        if kind == "claude-subscription":
            return "native-bundle" if agent == "claude" else "unsupported-native"
        if kind == "copilot":
            if auth == "github_token" and agent.startswith("opencode"):
                return "unsupported-auth"
            return (
                "native-token"
                if agent in ("copilot", "opencode-v1", "opencode-v2", "pi")
                else "unsupported-native"
            )
        if kind == "aws":
            return "gateway-required" if agent == "copilot" else "native-cloud"
        if kind == "gcp":
            return (
                "native-cloud"
                if agent in ("claude", "opencode-v1", "opencode-v2", "pi")
                else "gateway-required"
            )
        if kind == "foundry":
            if agent == "claude":
                return "native-cloud"
            return (
                "compatible-endpoint"
                if auth == "api_key"
                and agent in ("opencode-v1", "opencode-v2", "pi", "copilot")
                else "gateway-required"
            )
        if kind == "azure":
            return "gateway-required" if agent == "claude" else "native-azure"
        protocol = p.get("protocol")
        if protocol == "provider-native" and not agent.startswith("opencode"):
            return "gateway-required"
        if agent == "claude":
            return (
                "compatible-endpoint"
                if protocol == "anthropic-messages"
                else "gateway-required"
            )
        if agent == "codex":
            return (
                "native-api"
                if provider == "openai"
                else (
                    "compatible-endpoint"
                    if protocol == "openai-responses"
                    else "gateway-required"
                )
            )
        if agent == "copilot" and protocol == "google-generative-ai":
            return "compatible-endpoint"  # Google's separate OpenAI compatibility endpoint
        return (
            "native-api"
            if agent.startswith("opencode") or (agent == "pi" and p.get("pi_builtin"))
            else "compatible-endpoint"
        )


    def matrix():
        return [
            {"agent": a, "provider": pid, "auth": auth, "route": route(a, pid, auth)}
            for pid, p in PROVIDERS.items()
            for auth in p["auth_modes"]
            for a in AGENTS
        ]


    def key_source(req, p):
        if req.get("key_env"):
            name = variable(req["key_env"])
            read(name)
            return name
        override = (
            "AGENTCFG_" + token(req["agent"]) + "_" + token(req["provider"]) + "_API_KEY"
        )
        if present(override):
            return override
        return choose([p.get("key_env")] + p.get("aliases", []))


    def model_for(req):
        if req.get("model"):
            return req["model"]
        source = (
            req.get("model_env")
            or "AGENTCFG_" + token(req["agent"]) + "_" + token(req["provider"]) + "_MODEL"
        )
        return read(variable(source))


    def endpoint_url(value):
        from urllib.parse import urlsplit

        u = urlsplit(value)
        if (
            u.scheme not in ("https", "http")
            or not u.hostname
            or u.username
            or u.password
            or u.fragment
        ):
            raise ConfigError(
                "Expected an http(s) endpoint without embedded credentials or fragment"
            )
        if u.scheme == "http" and u.hostname not in ("localhost", "127.0.0.1", "::1"):
            raise ConfigError("Remote endpoints require https")
        return value


    def add_refs(profile, names):
        for n in names:
            if present(n):
                profile["env"][n] = n


    def native_oauth(req, profile, kind):
        a = req["agent"]
        defaults = {
            ("chatgpt", "codex"): "CODEX_AUTH_JSON",
            ("chatgpt", "opencode-v1"): "OPENCODE_V1_OPENAI_OAUTH_JSON",
            ("chatgpt", "opencode-v2"): "OPENCODE_OPENAI_AUTH_EXPORT_JSON",
            ("chatgpt", "pi"): "PI_OPENAI_CODEX_OAUTH_JSON",
            ("claude-subscription", "claude"): "CLAUDE_AUTH_JSON",
        }
        source = variable(req.get("credential_env") or defaults[(kind, a)])
        if req.get("credential_format") == "codex-native-legacy":
            if (
                kind != "chatgpt"
                or a not in ("opencode-v1", "opencode-v2")
                or req.get("allow_legacy_conversion") is not True
            ):
                raise ConfigError(
                    "Legacy Codex conversion requires an explicitly selected OpenCode legacy adapter"
                )
            native = json.loads(read(source))
            fields = native.get("tokens", {})
            provenance = fields.get("oauth_provenance") or req.get("oauth_provenance")
            if provenance != {
                "issuer": "https://auth.openai.com",
                "client_id": "app_EMoamEEZ73f0CkXaXp7hrann",
            }:
                raise ConfigError(
                    "Legacy conversion requires known matching OAuth issuer/client provenance"
                )
            if not all(
                isinstance(fields.get(k), str) and fields[k]
                for k in ("access_token", "refresh_token", "id_token")
            ):
                raise ConfigError("Incomplete native Codex subscription credentials")
            expiry = int(read(variable(req["expires_at_env"])))
            if expiry < 1_000_000_000_000:
                raise ConfigError(
                    "Legacy conversion requires explicit Unix-millisecond access-token expiry"
                )
            value = {
                "type": "oauth",
                "access": fields["access_token"],
                "refresh": fields["refresh_token"],
                "expires": expiry,
            }
            account = fields.get("account_id")
            if a == "opencode-v1":
                if account:
                    value["accountId"] = account
            else:
                value["methodID"] = "chatgpt-headless"
                if account:
                    value["metadata"] = {"accountID": account}
            profile["oauth_value"] = value
            return
        # Runtime-only Claude token takes priority only when explicitly selected.
        if kind == "claude-subscription" and source == "CLAUDE_CODE_OAUTH_TOKEN":
            read(source)
            profile["env"][source] = source
            return
        read(source)
        if a in ("codex", "claude"):
            value = json.loads(os.environ[source])
            if not isinstance(value, dict):
                raise ConfigError("Expected a native auth object")
            if a == "codex":
                fields = value.get("tokens", {})
                if not isinstance(fields, dict) or not all(
                    isinstance(fields.get(k), str) and fields[k]
                    for k in ("access_token", "refresh_token", "id_token")
                ):
                    raise ConfigError(
                        "Codex subscription bundle requires complete native tokens"
                    )
                if value.get("OPENAI_API_KEY"):
                    raise ConfigError(
                        "Subscription bundle also contains an API key; select one auth mode"
                    )
            else:
                fields = value.get("claudeAiOauth", {})
                if (
                    not isinstance(fields, dict)
                    or not isinstance(fields.get("accessToken"), str)
                    or not fields["accessToken"]
                ):
                    raise ConfigError(
                        "Expected a native Claude subscription credential bundle"
                    )
            profile["native_auth_json_env"] = source
        elif a == "opencode-v2":
            value = json.loads(os.environ[source])
            if not isinstance(value, list) or not value:
                raise ConfigError("Expected a native OpenCode export array")
            for entry in value:
                v = entry.get("value", {})
                if (
                    entry.get("integrationID") != "openai"
                    or v.get("type") != "oauth"
                    or v.get("methodID")
                    not in ("chatgpt-token-sharing", "chatgpt-browser", "chatgpt-headless")
                ):
                    raise ConfigError(
                        "Expected an OpenCode OpenAI subscription OAuth export"
                    )
                for k in ("access", "refresh"):
                    if not isinstance(v.get(k), str) or not v[k]:
                        raise ConfigError("Incomplete OAuth export")
                if not isinstance(v.get("expires"), int) or isinstance(v["expires"], bool):
                    raise ConfigError("Invalid OAuth expiry")
                m = v.get("metadata", {})
                if v["methodID"] == "chatgpt-token-sharing" and (
                    not m.get("clientID")
                    or "chatgpt.tokens.use.direct" not in m.get("scopes", [])
                ):
                    raise ConfigError(
                        "Token-sharing export requires clientID and granted token-sharing scope"
                    )
            profile["auth_export_json_env"] = source
        else:
            render.oauth(source)
            profile["oauth_json_env"] = source


    def compile_profile(req):
        a, pid = req["agent"], req["provider"]
        if a not in AGENTS or pid not in PROVIDERS:
            raise ConfigError("Unknown agent/provider")
        p = PROVIDERS[pid]
        auth = req.get("auth", p["auth_modes"][0])
