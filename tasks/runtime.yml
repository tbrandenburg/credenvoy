        for target, source in runtime.get("references", {}).items():
            if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", target) or not re.fullmatch(
                r"[A-Za-z_][A-Za-z0-9_]*", source
            ):
                raise ValueError("Invalid runtime env reference")
            if not parent.get(source):
                raise ValueError("Missing runtime credential/configuration variable")
            env[target] = parent[source]
        folder = str(Path(folder).resolve())
        if adapter == "claude":
            env["CLAUDE_CONFIG_DIR"] = folder
        elif adapter == "codex":
            env["CODEX_HOME"] = folder
        elif adapter == "pi":
            env["PI_CODING_AGENT_DIR"] = folder
        elif adapter == "copilot":
            env["COPILOT_HOME"] = folder
        elif adapter.startswith("opencode"):
