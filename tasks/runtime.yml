            "must be JSON-serialized into their named environment variable in real use; "
            "scalar values are environment-variable strings. Never use these "
            "synthetic values for a live login.",
            "",
        ]
        for sample in _PAYLOAD["showcase"]:
            displayed = {}
            for name, value in sample["environment"].items():
                displayed[name] = json.loads(value) if name.endswith("_JSON") else value
            with patch.dict(os.environ, sample["environment"], clear=True):
                profile = compiler.compile_profile(sample["profile"])
                outputs = renderer.render(profile)
            lines += [
                "## " + sample["title"],
                "",
                sample["note"],
                "",
                "**Runtime destination:** " + sample["destination"],
                "",
                "### Source environment inputs",
                "",
                "```json",
                json.dumps(displayed, indent=2),
                "```",
                "",
                "### Selected profile",
                "",
                "```json",
                json.dumps({"profiles": [sample["profile"]]}, indent=2),
                "```",
                "",
                "### Generated files",
                "",
            ]
            for filename, value in outputs.items():
                language = "toml" if filename.endswith(".toml") else "json"
                rendered = (
                    value.rstrip("\n")
                    if isinstance(value, str)
                    else json.dumps(value, indent=2)
                )
                lines += [
                    "#### `generated/" + profile["name"] + "/" + filename + "`",
                    "",
                    "```" + language,
                    rendered,
                    "```",
                    "",
                ]
        return "\n".join(lines)


    runtime.generated_examples = generated_examples
    runtime.SHOWCASE = _PAYLOAD["showcase"]


    def check_sources():
        for name, source in {**_PAYLOAD["sources"], **_PAYLOAD["tests"]}.items():
            ast.parse(source, filename=name)
        assert len(compiler.AGENTS) == len(set(compiler.AGENTS))
        for pid, provider in compiler.PROVIDERS.items():
            assert renderer.NAME.fullmatch(pid)
            assert provider["auth_modes"]
            assert len(provider["auth_modes"]) == len(set(provider["auth_modes"]))
        matrix = compiler.matrix()
        assert len(matrix) == len({(x["provider"], x["auth"], x["agent"]) for x in matrix})
        print(
            "Embedded Python syntax and registry invariants pass: "
            + str(len(matrix))
            + " permutations."
        )


    def run_tests():
        if not _PAYLOAD["tests"]:
            raise ValueError(
                "This export has no embedded tests; run task test in the repository"
            )
        package = types.ModuleType("credenvoy.tests")
        package.__path__ = []
        sys.modules["credenvoy.tests"] = package
        suite = unittest.TestSuite()
        for name, source in _PAYLOAD["tests"].items():
            module = load_module("credenvoy.tests." + name, source)
            suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
        result = unittest.TextTestRunner(verbosity=2).run(suite)
        if not result.wasSuccessful():
            raise SystemExit(1)


    def example():
        selected = os.environ.get("AGENTCFG_EXAMPLE", "local")
        if selected not in EXAMPLES:
            raise ValueError(
                "Unknown example; choose local, openai, suite, gateway or codex-to-opencode-legacy"
            )
        return EXAMPLES[selected]


    def main(argv=None):
        args = sys.argv[1:] if argv is None else argv
        if not args or args[0] in ("help", "--help", "-h"):
            print(
                "Credenvoy " + VERSION + " — your credentials, delivered to every agent.\n"
                "Commands: matrix, matrix:markdown, example, examples, examples:write, examples:check, init, validate, plan, generate, run, lint, test, smoke, export\n"
                "Selection: AGENTCFG_SPEC, AGENTCFG_OUTPUT, AGENTCFG_PROFILE, AGENTCFG_EXAMPLE"
            )
            return
        action, tail = args[0], args[1:]
        if action == "--version":
            print("Credenvoy " + VERSION)
        elif action in ("matrix", "plan", "generate", "validate"):
            compiler.main(["plan" if action == "validate" else action, *tail])
        elif action == "run":
            launcher.main(tail)
        elif action == "matrix:markdown":
            markdown_matrix()
        elif action in ("examples", "examples:write", "examples:check"):
            document = generated_examples()
            if action == "examples":
                print(document, end="")
            elif action == "examples:write":
                # Documentation contains synthetic data only, not native auth files.
                Path("EXAMPLES.md").write_text(document, encoding="utf-8", newline="\n")
                print("Updated EXAMPLES.md from synthetic inputs.")
            else:
                path = Path("EXAMPLES.md")
                if not path.is_file() or path.read_text(encoding="utf-8") != document:
                    raise SystemExit(
                        "EXAMPLES.md is stale or missing. Run task examples:write."
                    )
                print("EXAMPLES.md matches the generated synthetic walkthrough.")
        elif action == "example":
            print(json.dumps(example(), indent=2))
        elif action == "init":
            path = Path(os.environ.get("AGENTCFG_SPEC", "profiles.json"))
            content = json.dumps(example(), indent=2) + "\n"
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            with os.fdopen(fd, "w", encoding="utf-8") as stream:
                stream.write(content)
            print(
                "Created "
                + str(path)
                + "; edit the example model and export its required environment variables."
            )
        elif action == "lint":
            check_sources()
        elif action == "test":
            run_tests()
        elif action == "smoke":
            with tempfile.TemporaryDirectory() as temp:
                os.environ["LOCAL_BASE_URL"] = "http://127.0.0.1:11434/v1"
                spec = compiler.compile_spec(EXAMPLES["local"])
                count = renderer.stage(spec, Path(temp) / "generated")
                assert count > 0
            print("Offline local-profile generation passes; no agent CLI was launched.")
        elif action == "export":
            path = Path(os.environ.get("AGENTCFG_EXPORT", "credenvoy.py"))
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            with os.fdopen(fd, "w", encoding="utf-8") as stream:
                stream.write(engine_program())
            print("Exported the self-contained engine to " + str(path))
        else:
            raise ValueError("Unknown command")


    if __name__ == "__main__":
        try:
            main()
        except (ValueError, KeyError, TypeError, OSError):
            raise SystemExit(
                "Credenvoy failed: check the selected profile, inputs and output path. No secret values are shown."
            ) from None
tasks:
  _dispatch:
    internal: true
    silent: true
    cmds:
    - |
      "{{.PYTHON}}" - "{{.ACTION}}" <<'CREDENVOY_PYTHON'
      import json
      _PAYLOAD = {
          "sources": {
              "renderer": {{.RENDERER_SOURCE | toJson}},
              "compiler": {{.COMPILER_SOURCE | toJson}},
              "launcher": {{.LAUNCHER_SOURCE | toJson}},
          },
          "tests": {
              {{if eq .ACTION "test"}}
              "test_renderer": {{.TEST_RENDERER | toJson}},
              "test_compiler": {{.TEST_COMPILER | toJson}},
              "test_launcher": {{.TEST_LAUNCHER | toJson}},
              {{end}}
          },
          "registry": json.loads({{.REGISTRY | toJson}}),
          "env_names": json.loads({{.ENV_NAMES | toJson}}),
          "examples": json.loads({{.EXAMPLES | toJson}}),
          "showcase": json.loads({{.SHOWCASE | toJson}}),
      }
      _BOOTSTRAP_SOURCE = {{.BOOTSTRAP_SOURCE | toJson}}
      exec(compile(_BOOTSTRAP_SOURCE, '<credenvoy.runtime>', 'exec'))
      CREDENVOY_PYTHON
