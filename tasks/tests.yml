    import json
    import os
    import stat
    import tempfile
    import unittest
    from pathlib import Path
    from unittest.mock import patch

    from credenvoy import renderer as render


    class RenderTests(unittest.TestCase):
        def setUp(self):
            self.patch = patch.dict(
                os.environ,
                {
                    "TEST_KEY": 'fake-"key\\with\nnewline',
                    "GITHUB_COPILOT_OAUTH_TOKEN": "fake-gho-token",
                    "TEST_OAUTH": json.dumps(
                        {
                            "type": "oauth",
                            "refresh": "fake-refresh",
                            "access": "fake-access",
                            "expires": 1900000000000,
                        }
                    ),
                    "TEST_PROJECT": "project-id",
                },
                clear=True,
            )
            self.patch.start()
            self.addCleanup(self.patch.stop)

        def profile(self, agent, **kw):
            return dict(name="example", agent=agent, provider="anthropic", **kw)

        def test_v1_api_json_roundtrip(self):
            files = render.render(self.profile("opencode-v1", api_key_env="TEST_KEY"))
            self.assertEqual(
                json.loads(json.dumps(files["auth.json"]))["anthropic"]["key"],
                os.environ["TEST_KEY"],
            )
            self.assertEqual(files["auth.json"]["anthropic"]["type"], "api")

        def test_v1_copilot_bootstrap(self):
            p = self.profile("opencode-v1", github_oauth_env="GITHUB_COPILOT_OAUTH_TOKEN")
            p["provider"] = "github-copilot"
            self.assertEqual(
                render.render(p)["auth.json"]["github-copilot"],
                {
                    "type": "oauth",
                    "refresh": "fake-gho-token",
                    "access": "fake-gho-token",
                    "expires": 0,
                },
            )

        def test_v2_key_import(self):
            files = render.render(
                self.profile(
                    "opencode-v2", api_key_env="TEST_KEY", credential_id="cred_example"
                )
            )
            entry = files["credentials.import.json"][0]
            self.assertEqual(entry["value"]["type"], "key")
            self.assertNotIn("auth.json", files)

        def test_v2_oauth_method_required(self):
            with self.assertRaises(ValueError):
                render.render(
                    self.profile(
                        "opencode-v2",
                        oauth_json_env="TEST_OAUTH",
                        credential_id="cred_example",
                    )
                )

        def test_pi_runtime_reference(self):
            files = render.render(
                self.profile("pi", api_key_env="TEST_KEY", model="example-model")
            )
            self.assertEqual(files["auth.json"]["anthropic"]["key"], "${TEST_KEY}")
            self.assertEqual(files["settings.json"]["defaultProvider"], "anthropic")

        def test_pi_oauth(self):
            auth = render.render(self.profile("pi", oauth_json_env="TEST_OAUTH"))[
                "auth.json"
            ]
            self.assertEqual(auth["anthropic"]["expires"], 1900000000000)

        def test_claude_settings(self):
            files = render.render(self.profile("claude", api_key_env="TEST_KEY"))
            self.assertEqual(
                files["settings.json"]["env"]["ANTHROPIC_API_KEY"], os.environ["TEST_KEY"]
            )

        def test_claude_unsupported_provider(self):
            p = self.profile("claude", api_key_env="TEST_KEY")
            p["provider"] = "groq"
            with self.assertRaises(ValueError):
                render.render(p)

        def test_codex_toml_parse_and_env_reference(self):
            import tomllib

            p = self.profile(
                "codex",
                api_key_env="TEST_KEY",
                protocol="openai-responses",
                base_url="https://example.invalid/v1",
                model="test-model",
            )
            config = tomllib.loads(render.render(p)["config.toml"])
            self.assertEqual(config["model_providers"]["generated"]["env_key"], "TEST_KEY")
            self.assertNotIn(os.environ["TEST_KEY"], render.render(p)["config.toml"])

        def test_codex_rejects_chat_only(self):
            with self.assertRaises(ValueError):
                render.render(
                    self.profile(
                        "codex",
                        api_key_env="TEST_KEY",
                        base_url="https://example.invalid/v1",
                        protocol="openai-completions",
                    )
                )

        def test_copilot_byok_runtime(self):
            p = self.profile(
                "copilot",
                api_key_env="TEST_KEY",
                base_url="https://example.invalid",
                model="example",
                protocol="anthropic-messages",
            )
            files = render.render(p)
            self.assertNotIn("config.json", files)
            self.assertEqual(
                files["runtime.json"]["references"]["COPILOT_PROVIDER_API_KEY"], "TEST_KEY"
            )

        def test_invalid_oauth_expiry(self):
            with patch.dict(
                os.environ,
                {
                    "TEST_OAUTH": '{"type":"oauth","access":"a","refresh":"r","expires":true}'
                },
            ):
                with self.assertRaises(ValueError):
                    render.render(self.profile("pi", oauth_json_env="TEST_OAUTH"))

        def test_native_auth_bundle_preserved(self):
            value = {
                "tokens": {"access_token": "fake", "refresh_token": "fake"},
                "future_field": 1,
            }
            with patch.dict(os.environ, {"NATIVE_AUTH": json.dumps(value)}):
                files = render.render(
                    self.profile("codex", native_auth_json_env="NATIVE_AUTH")
                )
                self.assertEqual(files["auth.json"], value)

        def test_staging_private_and_no_overwrite(self):
            with tempfile.TemporaryDirectory() as folder:
                output = Path(folder) / "generated"
                render.stage(
                    {"profiles": [self.profile("opencode-v1", api_key_env="TEST_KEY")]},
                    output,
                )
                if os.name == "posix":
                    self.assertEqual(
                        stat.S_IMODE((output / "example/auth.json").stat().st_mode), 0o600
                    )
                    self.assertEqual(stat.S_IMODE(output.stat().st_mode), 0o700)
                with self.assertRaises(ValueError):
                    render.stage({"profiles": []}, output)

        def test_validate_all_before_writing(self):
            with tempfile.TemporaryDirectory() as folder:
                output = Path(folder) / "generated"
                spec = {
                    "profiles": [
                        self.profile("pi", api_key_env="TEST_KEY"),
                        dict(
                            name="bad",
                            agent="pi",
                            provider="anthropic",
                            api_key_env="MISSING",
                        ),
                    ]
                }
                with self.assertRaises(ValueError):
                    render.stage(spec, output)
                self.assertFalse(output.exists())


    if __name__ == "__main__":
        unittest.main()
