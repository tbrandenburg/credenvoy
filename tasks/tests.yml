                with patch.dict(os.environ, sample["environment"], clear=True):
                    outputs[sample["profile"]["name"]] = render.render(
                        c.compile_profile(sample["profile"])
                    )
            v1 = outputs["opencode-v1-codex-legacy"]["auth.json"]["openai"]
            self.assertEqual(v1["accountId"], "SYNTHETIC_ACCOUNT_ID")
            v2 = outputs["opencode-v2-codex-legacy"]["credentials.import.json"][0]["value"]
            self.assertEqual(v2["metadata"]["accountID"], "SYNTHETIC_ACCOUNT_ID")
            self.assertEqual(v2["methodID"], "chatgpt-headless")
            self.assertEqual(
                outputs["pi-groq"]["auth.json"]["groq"]["key"], "${GROQ_API_KEY}"
            )

        def test_generated_examples_standalone_drift_check(self):
            with tempfile.TemporaryDirectory() as temporary:
                root = Path(temporary)
                cli = root / "credenvoy.py"
                cli.write_text(engine_program(), encoding="utf-8")
                command = [sys.executable, str(cli)]
                missing = subprocess.run(
                    command + ["examples:check"], cwd=root, capture_output=True, text=True
                )
                self.assertNotEqual(missing.returncode, 0)
                subprocess.run(
                    command + ["examples:write"], cwd=root, capture_output=True, check=True
                )
                subprocess.run(
                    command + ["examples:check"], cwd=root, capture_output=True, check=True
                )
                (root / "EXAMPLES.md").write_text(
                    "stale synthetic walkthrough", encoding="utf-8"
                )
                stale = subprocess.run(
                    command + ["examples:check"], cwd=root, capture_output=True, text=True
                )
                self.assertNotEqual(stale.returncode, 0)
                self.assertIn("Run task examples:write", stale.stderr)

        def test_sample_plan_and_generation_end_to_end(self):
            env = dict(os.environ)
            env.update(
                {
                    n: "synthetic-model"
                    for n in (
                        "CLAUDE_MODEL",
                        "OPENAI_MODEL",
                        "CHATGPT_MODEL",
                        "COPILOT_MODEL",
                        "GROQ_MODEL",
                    )
                }
            )
            with tempfile.TemporaryDirectory() as temp:
                cli = Path(temp) / "credenvoy.py"
                cli.write_text(engine_program(), encoding="utf-8")
                command = [sys.executable, str(cli)]
                spec = str(Path(temp) / "profiles.json")
                Path(spec).write_text(json.dumps(EXAMPLES["suite"]), encoding="utf-8")
                plan = subprocess.run(
                    command + ["plan", "--spec", spec],
                    env=env,
                    cwd=temp,
                    capture_output=True,
                    text=True,
                    check=True,
                )
                self.assertNotIn("synthetic-key", plan.stdout)
                output = Path(temp) / "generated"
                subprocess.run(
                    command + ["generate", "--spec", spec, "--out", str(output)],
                    env=env,
                    cwd=temp,
                    capture_output=True,
                    text=True,
                    check=True,
                )
                self.assertEqual(len(list(output.iterdir())), 7)
                auth = json.loads((output / "codex-chatgpt/auth.json").read_text())
                self.assertEqual(auth["tokens"]["access_token"], "synthetic-access")


    if __name__ == "__main__":
        unittest.main()
