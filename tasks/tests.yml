        def test_opencode_normal_location_merge_backups_and_repeat(self):
            path = self.home / ".local/share/opencode/auth.json"
            path.parent.mkdir(parents=True)
            original = {
                "other": {"type": "api", "key": "KEEP"},
                "openai": {"type": "oauth", "refresh": "OLD"},
            }
            path.write_text(json.dumps(original), encoding="utf-8")
            plan = install.Installation()
            profile = self.profile("opencode-v1", api_key_env="TEST_KEY")
            plan.add(profile)
            self.apply(plan)
            result = self.read(path)
            self.assertEqual(result["other"], original["other"])
            self.assertEqual(
                result["openai"], {"type": "api", "key": os.environ["TEST_KEY"]}
            )
            backup = next(path.parent.glob("auth.json.credenvoy-backup-*"))
            self.assertEqual(self.read(backup), original)
            if os.name != "nt":
                self.assertEqual(stat.S_IMODE(path.stat().st_mode), 0o600)
                self.assertEqual(stat.S_IMODE(backup.stat().st_mode), 0o600)
            again = install.Installation()
            again.add(profile)
            self.apply(again)
            self.assertEqual(len(list(path.parent.glob("auth.json.credenvoy-backup-*"))), 1)
            self.assertFalse((self.home / "generated").exists())

