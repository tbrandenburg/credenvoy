        def test_force_rotates_same_v2_id_with_noninteractive_native_commands(self):
            db = self.home / ".local/share/opencode/opencode.db"
            db.parent.mkdir(parents=True)
            with contextlib.closing(sqlite3.connect(db)) as connection, connection:
                connection.execute("CREATE TABLE keep (value TEXT)")
            plan = install.Installation(force=True)
            plan.add(
                self.profile(
                    "opencode-v2", api_key_env="TEST_KEY", credential_id="synthetic"
                )
            )
            old = [
                {
                    "id": "synthetic",
                    "integrationID": "openai",
                    "value": {"type": "key", "key": "OLD"},
                    "active": True,
                }
            ]
            results = [
                SimpleNamespace(stdout="--standalone", stderr=""),
                SimpleNamespace(stdout="2.0.0", stderr=""),
                SimpleNamespace(stdout=json.dumps(old), stderr=""),
                SimpleNamespace(stdout="--standalone credential", stderr=""),
                SimpleNamespace(stdout="--standalone credential", stderr=""),
                SimpleNamespace(stdout="", stderr=""),
                SimpleNamespace(stdout="", stderr=""),
                SimpleNamespace(stdout="", stderr=""),
            ]
            with patch("credenvoy.installer.subprocess.run", side_effect=results) as call:
                self.apply(plan)
            operations = [entry.args[0] for entry in call.call_args_list]
            self.assertEqual(
                operations[-3],
                ["opencode", "auth", "logout", "openai", "synthetic", "--standalone"],
            )
            self.assertEqual(operations[-2], ["opencode", "auth", "import", "--standalone"])
            self.assertEqual(
                operations[-1],
                ["opencode", "auth", "switch", "openai", "synthetic", "--standalone"],
            )
            for entry in call.call_args_list[-3:]:
                self.assertIsNotNone(entry.kwargs["input"])
                self.assertNotIn(os.environ["TEST_KEY"], str(entry.args))
            self.assertEqual(len(list(db.parent.glob("*.credenvoy-backup-*"))), 1)

