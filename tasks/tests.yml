    import json
    import tempfile
    import unittest
    from pathlib import Path
    from types import SimpleNamespace
    from unittest.mock import patch

    from credenvoy import launcher as run


    class LauncherTests(unittest.TestCase):
        def test_competing_subscription_and_api_credentials_removed(self):
            parent = {
                "PATH": "/bin",
                "OPENAI_API_KEY": "wrong-api",
                "CLAUDE_CODE_OAUTH_TOKEN": "wrong-subscription",
                "COPILOT_GITHUB_TOKEN": "wrong-github",
                "GITHUB_COPILOT_OAUTH_TOKEN": "wrong-github-oauth",
                "PI_OPENAI_CODEX_OAUTH_JSON": "wrong-bundle",
                "CODEX_AUTH_JSON": "wrong-bundle",
                "MY_KEY": "selected",
            }
            runtime = {"adapter": "pi", "references": {"OPENAI_API_KEY": "MY_KEY"}}
            env = run.runtime_environment("/tmp/profile", runtime, parent)
            self.assertEqual(env["OPENAI_API_KEY"], "selected")
            for name in (
                "CLAUDE_CODE_OAUTH_TOKEN",
                "COPILOT_GITHUB_TOKEN",
                "GITHUB_COPILOT_OAUTH_TOKEN",
                "CODEX_AUTH_JSON",
                "PI_OPENAI_CODEX_OAUTH_JSON",
            ):
                self.assertNotIn(name, env)
            self.assertEqual(
                env["PI_CODING_AGENT_DIR"], str(Path("/tmp/profile").resolve())
            )

        def test_opencode_v2_isolated_database(self):
            env = run.runtime_environment(
                "/tmp/profile",
                {"adapter": "opencode-v2"},
                {"OPENCODE_DB": "/wrong/shared.db"},
            )
            self.assertEqual(
                env["OPENCODE_DB"],
                str(Path("/tmp/profile").resolve() / "state/opencode/opencode.db"),
            )

        def test_missing_runtime_reference_rejected(self):
            with self.assertRaises(ValueError):
                run.runtime_environment(
                    "/tmp/profile",
                    {"adapter": "codex", "references": {"OPENAI_API_KEY": "MISSING"}},
                    {},
                )

        def test_open_code_version_mismatch_rejected(self):
            with patch(
                "credenvoy.launcher.subprocess.run",
                return_value=SimpleNamespace(stdout="opencode 1.2.27"),
            ):
                with self.assertRaises(ValueError):
                    run.check_version("opencode-v2", "opencode", {})

        def test_v1_bootstrap_preserves_refreshed_state(self):
            with tempfile.TemporaryDirectory() as temp:
                folder = Path(temp)
                (folder / "auth.json").write_text('{"new":"bootstrap"}')
                run.bootstrap(folder, {"adapter": "opencode-v1"}, {})
                target = folder / "state/opencode/auth.json"
                target.write_text('{"refreshed":"current"}')
                run.bootstrap(folder, {"adapter": "opencode-v1"}, {})
                self.assertEqual(json.loads(target.read_text()), {"refreshed": "current"})

        def test_v2_import_only_once_and_private_server(self):
            with tempfile.TemporaryDirectory() as temp:
                folder = Path(temp)
                (folder / "credentials.import.json").write_text("[]")
                with patch(
                    "credenvoy.launcher.subprocess.run",
                    side_effect=[
                        SimpleNamespace(stdout="--standalone"),
                        SimpleNamespace(stdout="Imported 1 credential"),
                    ],
                ) as call:
                    run.bootstrap(folder, {"adapter": "opencode-v2"}, {})
                    run.bootstrap(folder, {"adapter": "opencode-v2"}, {})
                    self.assertEqual(call.call_count, 2)
                    self.assertIn("--standalone", call.call_args_list[-1].args[0])

        def test_v2_refuses_implicit_shared_server(self):
            with tempfile.TemporaryDirectory() as temp:
                folder = Path(temp)
                (folder / "credentials.import.json").write_text("[]")
                with patch(
                    "credenvoy.launcher.subprocess.run",
                    return_value=SimpleNamespace(stdout="other flags"),
                ) as call:
                    with self.assertRaises(ValueError):
                        run.bootstrap(folder, {"adapter": "opencode-v2"}, {})
                    self.assertEqual(call.call_count, 1)
                    self.assertFalse((folder / "state/.credentials-imported").exists())


