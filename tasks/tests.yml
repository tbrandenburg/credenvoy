    import json
    import os
    import subprocess
    import sys
    import tempfile
    import unittest
    from pathlib import Path
    from unittest.mock import patch

    import tomllib
    from credenvoy.runtime import EXAMPLES, SHOWCASE, engine_program, generated_examples

    from credenvoy import compiler as c
    from credenvoy import renderer as render


    def synthetic_environment():
        values = {
            name: os.environ[name]
            for name in ("SYSTEMROOT", "WINDIR", "PATH", "TEMP", "TMP")
            if name in os.environ
        }
        for p in c.PROVIDERS.values():
            for n in [p.get("key_env")] + p.get("aliases", []):
                if n:
                    values[n] = "synthetic-key"
        values.update(
            AWS_REGION="us-east-1",
            AWS_PROFILE="synthetic",
            AWS_BEARER_TOKEN_BEDROCK="synthetic",
            GOOGLE_CLOUD_PROJECT="synthetic-project",
            GOOGLE_CLOUD_LOCATION="us-central1",
            GOOGLE_APPLICATION_CREDENTIALS="/synthetic/adc.json",
            ANTHROPIC_FOUNDRY_BASE_URL="https://synthetic.services.ai.azure.com/anthropic",
            ANTHROPIC_FOUNDRY_API_KEY="synthetic-key",
            ANTHROPIC_FOUNDRY_AUTH_TOKEN="synthetic-token",
            AZURE_OPENAI_BASE_URL="https://synthetic.openai.azure.com/openai/v1",
            AZURE_RESOURCE_NAME="synthetic",
            CLOUDFLARE_ACCOUNT_ID="synthetic",
            CLOUDFLARE_GATEWAY_ID="synthetic",
            GITHUB_COPILOT_OAUTH_TOKEN="synthetic-gho",
            COPILOT_GITHUB_TOKEN="synthetic-github-pat",
            GATEWAY_URL="https://synthetic.invalid/v1",
            GATEWAY_KEY="synthetic-gateway-key",
            LOCAL_BASE_URL="http://127.0.0.1:11434/v1",
            AGENTCFG_CLOUDFLARE_AI_GATEWAY_BASE_URL="https://synthetic.invalid/v1",
        )
        oauth = {
            "type": "oauth",
            "access": "synthetic-access",
            "refresh": "synthetic-refresh",
            "expires": 1900000000000,
        }
        for n in ("PI_OPENAI_CODEX_OAUTH_JSON", "OPENCODE_V1_OPENAI_OAUTH_JSON"):
            values[n] = json.dumps(oauth)
        values["CODEX_AUTH_JSON"] = json.dumps(
            {
                "auth_mode": "chatgpt",
                "tokens": {
                    "id_token": "synthetic-id",
                    "access_token": "synthetic-access",
                    "refresh_token": "synthetic-refresh",
                    "account_id": "synthetic-account",
                },
            }
        )
        values["CLAUDE_AUTH_JSON"] = json.dumps(
            {
                "claudeAiOauth": {
                    "accessToken": "synthetic-access",
                    "refreshToken": "synthetic-refresh",
                    "expiresAt": 1900000000000,
                }
            }
        )
        values["OPENCODE_OPENAI_AUTH_EXPORT_JSON"] = json.dumps(
            [
                {
                    "id": "cred_synthetic",
                    "integrationID": "openai",
                    "label": "test",
                    "active": True,
                    "value": {
                        **oauth,
                        "methodID": "chatgpt-token-sharing",
                        "metadata": {
                            "clientID": "synthetic-client",
                            "scopes": ["chatgpt.tokens.use.direct"],
                        },
                    },
                }
            ]
        )
        return values


    class MatrixTests(unittest.TestCase):
        def setUp(self):
            self.patch = patch.dict(os.environ, synthetic_environment(), clear=True)
            self.patch.start()
            self.addCleanup(self.patch.stop)

        def test_cartesian_matrix_complete(self):
            expected = sum(len(p["auth_modes"]) for p in c.PROVIDERS.values()) * len(
                c.AGENTS
            )
            rows = c.matrix()
            self.assertEqual(len(rows), expected)
            self.assertEqual(
                len({(x["agent"], x["provider"], x["auth"]) for x in rows}), expected
            )

        def test_every_supported_permutation_renders_or_rejects_explicitly(self):
            for row in c.matrix():
                with self.subTest(**row):
                    req = {**row, "model": "synthetic-model"}
                    if row["route"].startswith("unsupported"):
                        with self.assertRaises(c.ConfigError):
                            c.compile_profile(req)
                        continue
                    if row["route"] == "gateway-required":
                        with self.assertRaises(c.ConfigError):
                            c.compile_profile(req)
                        req["endpoint"] = {
                            "protocol": "anthropic-messages"
                            if row["agent"] == "claude"
                            else "openai-responses"
                            if row["agent"] == "codex"
                            else "openai-completions",
                            "base_url_env": "GATEWAY_URL",
                            "key_env": "GATEWAY_KEY",
                        }
                    profile = c.compile_profile(req)
                    files = render.render(profile)
                    self.assertTrue(files)
                    for name, value in files.items():
                        if name.endswith(".toml"):
                            tomllib.loads(value)
                        else:
                            json.loads(json.dumps(value))

        def test_subscription_preserves_client_and_scope(self):
            p = c.compile_profile(
                {"agent": "opencode-v2", "provider": "openai-chatgpt", "model": "test"}
            )
            value = render.render(p)["credentials.import.json"][0]["value"]
            self.assertEqual(value["methodID"], "chatgpt-token-sharing")
            self.assertEqual(value["metadata"]["clientID"], "synthetic-client")

        def test_subscription_does_not_accept_api_key_only(self):
            with patch.dict(
                os.environ, {"CODEX_AUTH_JSON": '{"OPENAI_API_KEY":"synthetic"}'}
            ):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {"agent": "codex", "provider": "openai-chatgpt", "model": "test"}
                    )

        def test_explicit_legacy_codex_conversion(self):
            value = json.loads(os.environ["CODEX_AUTH_JSON"])
            value["tokens"]["oauth_provenance"] = {
                "issuer": "https://auth.openai.com",
                "client_id": "app_EMoamEEZ73f0CkXaXp7hrann",
            }
            with patch.dict(
                os.environ,
                {"CODEX_AUTH_JSON": json.dumps(value), "CODEX_EXPIRY": "1900000000000"},
            ):
                for a in ("opencode-v1", "opencode-v2"):
                    p = c.compile_profile(
                        {
                            "agent": a,
                            "provider": "openai-chatgpt",
                            "model": "test",
                            "credential_format": "codex-native-legacy",
                            "allow_legacy_conversion": True,
                            "credential_env": "CODEX_AUTH_JSON",
                            "expires_at_env": "CODEX_EXPIRY",
                        }
                    )
                    files = render.render(p)
                    credential = (
                        files["auth.json"]["openai"]
                        if a == "opencode-v1"
                        else files["credentials.import.json"][0]["value"]
                    )
                    self.assertEqual(credential["access"], "synthetic-access")
                    self.assertEqual(credential["refresh"], "synthetic-refresh")
                    if a == "opencode-v2":
                        self.assertEqual(credential["methodID"], "chatgpt-headless")

        def test_legacy_conversion_rejects_wrong_issuer_client(self):
            with patch.dict(os.environ, {"CODEX_EXPIRY": "1900000000000"}):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {
                            "agent": "opencode-v2",
                            "provider": "openai-chatgpt",
                            "model": "test",
                            "credential_format": "codex-native-legacy",
                            "allow_legacy_conversion": True,
                            "credential_env": "CODEX_AUTH_JSON",
                            "expires_at_env": "CODEX_EXPIRY",
                            "oauth_provenance": {
                                "issuer": "https://different.invalid",
                                "client_id": "different",
                            },
                        }
                    )

        def test_token_sharing_requires_granted_scope(self):
            value = json.loads(os.environ["OPENCODE_OPENAI_AUTH_EXPORT_JSON"])
            value[0]["value"]["metadata"]["scopes"] = []
            with patch.dict(
                os.environ, {"OPENCODE_OPENAI_AUTH_EXPORT_JSON": json.dumps(value)}
            ):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {
                            "agent": "opencode-v2",
                            "provider": "openai-chatgpt",
                            "model": "test",
                        }
                    )

        def test_conflicting_aliases_rejected(self):
            with patch.dict(os.environ, {"GOOGLE_API_KEY": "different"}):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {"agent": "pi", "provider": "google", "model": "test"}
                    )

        def test_explicit_per_agent_key_wins(self):
            with patch.dict(
                os.environ,
                {"AGENTCFG_PI_GOOGLE_API_KEY": "override", "GOOGLE_API_KEY": "different"},
            ):
                p = c.compile_profile(
                    {"agent": "pi", "provider": "google", "model": "test"}
                )
                self.assertEqual(p["api_key_env"], "AGENTCFG_PI_GOOGLE_API_KEY")

        def test_no_accidental_secret_forwarding_to_gateway(self):
            with self.assertRaises(c.ConfigError):
                c.compile_profile(
                    {
                        "agent": "claude",
                        "provider": "openai",
                        "model": "test",
                        "endpoint": {
                            "protocol": "anthropic-messages",
                            "base_url_env": "GATEWAY_URL",
                        },
                    }
                )

        def test_wrong_gateway_wire_api_rejected(self):
            with self.assertRaises(c.ConfigError):
                c.compile_profile(
                    {
                        "agent": "codex",
                        "provider": "groq",
                        "model": "test",
                        "endpoint": {
                            "protocol": "openai-completions",
                            "base_url_env": "GATEWAY_URL",
                            "key_env": "GATEWAY_KEY",
                        },
                    }
                )

        def test_no_subscription_gateway_forwarding(self):
            with self.assertRaises(c.ConfigError):
                c.compile_profile(
                    {
                        "agent": "codex",
                        "provider": "openai-chatgpt",
                        "model": "test",
                        "endpoint": {
                            "protocol": "openai-responses",
                            "base_url_env": "GATEWAY_URL",
                            "key_env": "GATEWAY_KEY",
                        },
                    }
                )

        def test_partial_aws_key_pair_rejected(self):
            with patch.dict(os.environ, {"AWS_ACCESS_KEY_ID": "synthetic"}):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {
                            "agent": "pi",
                            "provider": "amazon-bedrock",
                            "auth": "ambient",
                            "model": "test",
                        }
                    )

        def test_all_profiles_prevalidated(self):
            spec = {
                "profiles": [
                    {"agent": "pi", "provider": "openai", "model": "test"},
                    {"agent": "claude", "provider": "openai", "model": "test"},
                ]
            }
            with self.assertRaises(c.ConfigError):
                c.compile_spec(spec)

        def test_no_secret_values_in_plan(self):
            p = c.compile_profile({"agent": "pi", "provider": "openai", "model": "test"})
            self.assertNotIn("synthetic-key", json.dumps(p))

        def test_remote_plaintext_endpoint_rejected(self):
            with patch.dict(os.environ, {"GATEWAY_URL": "http://remote.invalid/v1"}):
                with self.assertRaises(c.ConfigError):
                    c.compile_profile(
                        {
                            "agent": "codex",
                            "provider": "groq",
                            "model": "test",
                            "endpoint": {
                                "protocol": "openai-responses",
                                "base_url_env": "GATEWAY_URL",
                                "key_env": "GATEWAY_KEY",
                            },
                        }
                    )

        def test_generated_examples_ignore_ambient_credentials_and_restore_environment(
            self,
        ):
            expected = generated_examples()
            with patch.dict(
                os.environ,
                {
                    "OPENAI_API_KEY": "DO_NOT_LEAK",
                    "GROQ_API_KEY": "DO_NOT_LEAK",
                    "AGENT_CONFIG_SPEC": "DO_NOT_LEAK",
                },
            ):
                self.assertEqual(generated_examples(), expected)
                self.assertEqual(os.environ["OPENAI_API_KEY"], "DO_NOT_LEAK")
            self.assertNotIn("DO_NOT_LEAK", expected)

        def test_generated_examples_have_valid_json_and_toml_blocks(self):
            import re

            document = generated_examples()
            blocks = re.findall(r"```(json|toml)\n(.*?)\n```", document, re.DOTALL)
            self.assertGreater(len(blocks), 12)
            for language, text in blocks:
                if language == "json":
                    json.loads(text)
                else:
                    tomllib.loads(text)
            self.assertIn("~/.local/share/opencode/auth.json", document)
            self.assertIn("state/opencode/opencode.db", document)
