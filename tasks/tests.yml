        def test_native_commands_use_stdin_preflight_and_database_backup(self):
            db = self.home / ".local/share/opencode/opencode.db"
            db.parent.mkdir(parents=True)
            with contextlib.closing(sqlite3.connect(db)) as connection, connection:
                connection.execute("CREATE TABLE keep (value TEXT)")
                connection.execute("INSERT INTO keep VALUES ('KEEP')")
            plan = install.Installation()
            plan.add(
                self.profile(
                    "opencode-v2", api_key_env="TEST_KEY", credential_id="synthetic"
                )
            )
            real_connect = sqlite3.connect
            opened = []

            def track_connection(*args, **kwargs):
                connection = real_connect(*args, **kwargs)
                opened.append(connection)
                return connection

            with (
                patch(
                    "credenvoy.installer.subprocess.run",
                    side_effect=[
                        SimpleNamespace(stdout="--standalone", stderr=""),
                        SimpleNamespace(stdout="2.0.0", stderr=""),
                        SimpleNamespace(stdout="[]", stderr=""),
                        SimpleNamespace(stdout="--standalone credential", stderr=""),
                        SimpleNamespace(stdout="", stderr=""),
                        SimpleNamespace(stdout="", stderr=""),
                    ],
                ) as call,
                patch("credenvoy.installer.sqlite3.connect", side_effect=track_connection),
            ):
                self.apply(plan)
            self.assertEqual(call.call_count, 6)
            self.assertEqual(len(opened), 2)
            for connection in opened:
                with self.assertRaises(sqlite3.ProgrammingError):
                    connection.execute("SELECT 1")
            args, kwargs = call.call_args_list[-2]
            self.assertEqual(args[0], ["opencode", "auth", "import", "--standalone"])
            self.assertEqual(
                json.loads(kwargs["input"])[0]["value"]["key"], os.environ["TEST_KEY"]
            )
            self.assertNotIn(os.environ["TEST_KEY"], str(args))
            backup = next(db.parent.glob("opencode.db.credenvoy-backup-*"))
            with contextlib.closing(sqlite3.connect(backup)) as connection:
                self.assertEqual(
                    connection.execute("SELECT value FROM keep").fetchone(), ("KEEP",)
                )

