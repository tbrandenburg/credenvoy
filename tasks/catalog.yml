    - task: :runtime:_dispatch
      vars:
        ACTION: '{{.ACTION}}'
        REGISTRY: '{{.CATALOG_REGISTRY}}'
        ENV_NAMES: '{{.CATALOG_ENV_NAMES}}'
        EXAMPLES: '{{.CATALOG_EXAMPLES}}'
        TEST_RENDERER: '{{if eq .ACTION "test"}}{{.TEST_RENDERER}}{{end}}'
        TEST_COMPILER: '{{if eq .ACTION "test"}}{{.TEST_COMPILER}}{{end}}'
        TEST_LAUNCHER: '{{if eq .ACTION "test"}}{{.TEST_LAUNCHER}}{{end}}'
        TEST_INSTALLER: '{{if eq .ACTION "test"}}{{.TEST_INSTALLER}}{{end}}'
        SHOWCASE: '{{.CATALOG_SHOWCASE}}'
        INSTALL_TEMPLATES: '{{.CATALOG_INSTALL_TEMPLATES}}'
        SELECTION_AGENTS: '{{.SELECTION_AGENTS | default ""}}'
        SELECTION_PROVIDER: '{{.SELECTION_PROVIDER | default ""}}'
        SELECTION_AUTH: '{{.SELECTION_AUTH | default ""}}'
        SELECTION_MODEL: '{{.SELECTION_MODEL | default ""}}'
        SELECTION_TEMPLATE: '{{.SELECTION_TEMPLATE | default ""}}'
        SELECTION_FORCE: '{{.SELECTION_FORCE | default "false"}}'
        SELECTION_SPEC: '{{.SELECTION_SPEC | default ""}}'

