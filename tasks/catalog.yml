  CATALOG_SHOWCASE: |-
    [
      {
        "title": "ChatGPT subscription \u2192 Codex",
        "profile": {
          "name": "codex-subscription",
          "agent": "codex",
          "provider": "openai-chatgpt",
          "auth": "subscription",
          "model": "SYNTHETIC_MODEL_ID"
        },
        "environment": {
          "CODEX_AUTH_JSON": "{\"auth_mode\": \"chatgpt\", \"tokens\": {\"id_token\": \"SYNTHETIC_ID_TOKEN\", \"access_token\": \"SYNTHETIC_ACCESS_TOKEN\", \"refresh_token\": \"SYNTHETIC_REFRESH_TOKEN\", \"account_id\": \"SYNTHETIC_ACCOUNT_ID\", \"oauth_provenance\": {\"issuer\": \"https://auth.openai.com\", \"client_id\": \"app_EMoamEEZ73f0CkXaXp7hrann\"}}, \"last_refresh\": \"2030-01-01T00:00:00Z\"}"
        },
        "destination": "`generated/codex-subscription/auth.json`, selected through the profile\u2019s `CODEX_HOME`.",
        "note": "The native auth bundle is preserved, including account and OAuth provenance fields. The normal home-directory cache is `~/.codex/auth.json`; Credenvoy selects this profile\u2019s directory instead."
      },
      {
        "title": "Legacy Codex OAuth \u2192 OpenCode V1",
        "profile": {
          "name": "opencode-v1-codex-legacy",
          "agent": "opencode-v1",
          "provider": "openai-chatgpt",
          "auth": "subscription",
          "model": "SYNTHETIC_MODEL_ID",
          "credential_env": "CODEX_AUTH_JSON",
          "credential_format": "codex-native-legacy",
          "allow_legacy_conversion": true,
          "expires_at_env": "CODEX_ACCESS_TOKEN_EXPIRES_AT_MS"
        },
        "environment": {
          "CODEX_AUTH_JSON": "{\"auth_mode\": \"chatgpt\", \"tokens\": {\"id_token\": \"SYNTHETIC_ID_TOKEN\", \"access_token\": \"SYNTHETIC_ACCESS_TOKEN\", \"refresh_token\": \"SYNTHETIC_REFRESH_TOKEN\", \"account_id\": \"SYNTHETIC_ACCOUNT_ID\", \"oauth_provenance\": {\"issuer\": \"https://auth.openai.com\", \"client_id\": \"app_EMoamEEZ73f0CkXaXp7hrann\"}}, \"last_refresh\": \"2030-01-01T00:00:00Z\"}",
          "CODEX_ACCESS_TOKEN_EXPIRES_AT_MS": "1900000000000"
        },
        "destination": "Credential bootstrap: `generated/opencode-v1-codex-legacy/state/opencode/auth.json`.",
        "note": "This is the legacy provider-keyed V1 format. OpenCode V1 normally uses `~/.local/share/opencode/auth.json` (or `$XDG_DATA_HOME/opencode/auth.json`); Credenvoy sets an isolated `XDG_DATA_HOME`. The staged `auth.json` is copied only for bootstrap, preserving later refreshes. Never replace a running CLI\u2019s auth file with a stale snapshot. Conversion requires the explicit opt-in, matching known issuer/client provenance, and a supplied Unix-millisecond access-token expiry. Synthetic values demonstrate field mapping only; they prove no live cross-client refresh compatibility."
      },
      {
        "title": "Legacy Codex OAuth \u2192 OpenCode V2",
        "profile": {
          "name": "opencode-v2-codex-legacy",
          "agent": "opencode-v2",
          "provider": "openai-chatgpt",
          "auth": "subscription",
          "model": "SYNTHETIC_MODEL_ID",
          "credential_env": "CODEX_AUTH_JSON",
          "credential_format": "codex-native-legacy",
          "allow_legacy_conversion": true,
          "expires_at_env": "CODEX_ACCESS_TOKEN_EXPIRES_AT_MS"
        },
        "environment": {
          "CODEX_AUTH_JSON": "{\"auth_mode\": \"chatgpt\", \"tokens\": {\"id_token\": \"SYNTHETIC_ID_TOKEN\", \"access_token\": \"SYNTHETIC_ACCESS_TOKEN\", \"refresh_token\": \"SYNTHETIC_REFRESH_TOKEN\", \"account_id\": \"SYNTHETIC_ACCOUNT_ID\", \"oauth_provenance\": {\"issuer\": \"https://auth.openai.com\", \"client_id\": \"app_EMoamEEZ73f0CkXaXp7hrann\"}}, \"last_refresh\": \"2030-01-01T00:00:00Z\"}",
          "CODEX_ACCESS_TOKEN_EXPIRES_AT_MS": "1900000000000"
        },
        "destination": "Import input: `generated/opencode-v2-codex-legacy/credentials.import.json`. Runtime database: `generated/opencode-v2-codex-legacy/state/opencode/opencode.db`.",
        "note": "This selects the examined legacy `chatgpt-headless` method and maps the account to `metadata.accountID`. V2 imports the array once into SQLite through standalone mode; it does not continually read a home-directory `auth.json`. Import is additive, not credential rotation. Conversion requires the explicit opt-in, matching known issuer/client provenance, and a supplied Unix-millisecond access-token expiry. Synthetic values demonstrate field mapping only; they prove no live cross-client refresh compatibility."
      },
      {
        "title": "Native ChatGPT token sharing \u2192 OpenCode V2",
        "profile": {
          "name": "opencode-v2-chatgpt",
          "agent": "opencode-v2",
          "provider": "openai-chatgpt",
          "auth": "subscription",
          "model": "SYNTHETIC_MODEL_ID"
        },
        "environment": {
          "OPENCODE_OPENAI_AUTH_EXPORT_JSON": "[{\"id\": \"cred_synthetic_openai\", \"integrationID\": \"openai\", \"label\": \"Synthetic subscription example\", \"active\": true, \"value\": {\"type\": \"oauth\", \"methodID\": \"chatgpt-token-sharing\", \"access\": \"SYNTHETIC_TOKEN_SHARING_ACCESS\", \"refresh\": \"SYNTHETIC_TOKEN_SHARING_REFRESH\", \"expires\": 1900000000000, \"metadata\": {\"clientID\": \"SYNTHETIC_TOKEN_SHARING_CLIENT\", \"scopes\": [\"openid\", \"offline_access\", \"chatgpt.tokens.use.direct\"]}}}]"
        },
        "destination": "Import input: `generated/opencode-v2-chatgpt/credentials.import.json`. Runtime database: `generated/opencode-v2-chatgpt/state/opencode/opencode.db`.",
        "note": "This starts with an OpenCode-native export from the selected login method. The generator preserves the original credential ID, method, client ID and granted scopes. It cannot turn ordinary Codex tokens into token-sharing credentials by renaming fields."
      },
      {
        "title": "Groq API key \u2192 Pi",
        "profile": {
          "name": "pi-groq",
          "agent": "pi",
          "provider": "groq",
          "auth": "api_key",
          "model": "SYNTHETIC_MODEL_ID"
        },
        "environment": {
          "GROQ_API_KEY": "SYNTHETIC_GROQ_API_KEY"
        },
        "destination": "`generated/pi-groq/auth.json`, selected through `PI_CODING_AGENT_DIR`.",
        "note": "Pi\u2019s key is an explicit runtime environment reference. The resolved synthetic API key does not appear in the generated auth entry. The normal Pi agent directory is `~/.pi/agent`; the launcher selects this profile\u2019s directory."
      },
      {
        "title": "Copilot upstream OAuth \u2192 OpenCode V1",
        "profile": {
          "name": "opencode-v1-copilot",
          "agent": "opencode-v1",
          "provider": "github-copilot",
          "auth": "oauth",
          "model": "SYNTHETIC_MODEL_ID"
        },
        "environment": {
          "GITHUB_COPILOT_OAUTH_TOKEN": "SYNTHETIC_UPSTREAM_GITHUB_OAUTH_TOKEN"
        },
        "destination": "Credential bootstrap: `generated/opencode-v1-copilot/state/opencode/auth.json`.",
        "note": "In this examined V1 bootstrap shape, `refresh` and `access` initially contain the same upstream GitHub OAuth token and `expires` is zero. That upstream token is distinct from a short-lived Copilot inference session token. The synthetic value is not a usable credential."
      }
    ]
