name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Verify the portable Taskfiles in isolation
        shell: python
        run: |
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary)
              shutil.copyfile('Taskfile.yml', root / 'Taskfile.yml')
              shutil.copytree('tasks', root / 'tasks')
              subprocess.run(['task', 'check'], cwd=root, check=True)
              result = subprocess.run(
                  ['task', 'matrix'], cwd=root, check=True,
                  capture_output=True, text=True,
              )
              matrix = json.loads(result.stdout)
              assert matrix['provider_count'] == 44
              assert matrix['agent_count'] == 6
              assert len(matrix['cells']) == 288

              # Exercise the public installation tasks with a synthetic native home.
              native_home = root.resolve() / 'native-pi'
              environment = {
                  **os.environ,
                  'PI_CODING_AGENT_DIR': str(native_home),
                  'GROQ_API_KEY': 'SYNTHETIC-CI-KEY',
                  'AGENT_CONFIG_SPEC': json.dumps({'profiles': [{
                      'name': 'ci-pi', 'agent': 'pi', 'provider': 'groq',
                      'auth': 'api_key', 'model': 'synthetic-model',
                  }]}),
              }
              environment.pop('AGENTCFG_PROFILE', None)
              for action in ('install:plan', 'install'):
                  result = subprocess.run(
                      ['task', action], cwd=root, env=environment,
                      check=True, capture_output=True, text=True,
                  )
                  assert 'SYNTHETIC-CI-KEY' not in result.stdout + result.stderr
                  if action == 'install:plan':
                      assert not native_home.exists()
              auth = json.loads((native_home / 'auth.json').read_text(encoding='utf-8'))
              assert auth['groq']['key'] == 'SYNTHETIC-CI-KEY'
              assert not (root / 'generated').exists()

              # Discover a synthetic Pi executable on PATH without running an agent.
              shim = root / 'agent-bin'
              shim.mkdir()
              executable = shim / ('pi.cmd' if os.name == 'nt' else 'pi')
              executable.write_text('@exit /b 0\n' if os.name == 'nt' else '#!/bin/sh\nexit 0\n', encoding='utf-8')
              executable.chmod(0o700)
              task_executable = shutil.which('task')
              minimal = {key: os.environ[key] for key in ('SYSTEMROOT', 'WINDIR', 'TEMP', 'TMP', 'PATHEXT') if key in os.environ}
              minimal.update(PATH=str(shim), PYTHON=sys.executable, PYTHONUTF8='1', GROQ_API_KEY='SYNTHETIC-DISCOVERY-KEY')
              for label, selectors in (
                  ('automatic', []),
                  ('parameters', ['AGENTS=pi', 'PROVIDER=groq', 'AUTH=api_key', 'MODEL=literal $(touch SHOULD_NOT_EXIST)']),
                  ('template', ['AGENTS=pi', 'TEMPLATE=groq-api']),
              ):
                  destination = root.resolve() / label
                  environment = {**minimal, 'PI_CODING_AGENT_DIR': str(destination)}
                  for action in ('install:plan', 'install'):
                      result = subprocess.run(
                          [task_executable, action, "PYTHON=" + sys.executable, *selectors], cwd=root, env=environment,
                          check=True, capture_output=True, text=True,
                      )
                      assert 'SYNTHETIC-DISCOVERY-KEY' not in result.stdout + result.stderr
                      if action == 'install:plan':
                          assert not destination.exists()
                  auth = json.loads((destination / 'auth.json').read_text(encoding='utf-8'))
                  assert auth['groq']['key'] == 'SYNTHETIC-DISCOVERY-KEY'
                  if label == 'parameters':
                      settings = json.loads((destination / 'settings.json').read_text(encoding='utf-8'))
                      assert settings['defaultModel'] == 'literal $(touch SHOULD_NOT_EXIST)'
                  assert not (root / 'SHOULD_NOT_EXIST').exists()

                  # Repeat without force is a semantic no-op; changed credentials need force.
                  original = (destination / 'auth.json').read_bytes()
                  subprocess.run([task_executable, 'install', "PYTHON=" + sys.executable, *selectors], cwd=root, env=environment, check=True, capture_output=True, text=True)
                  assert (destination / 'auth.json').read_bytes() == original
                  assert not list(destination.glob('*.credenvoy-backup-*'))
                  rotated = {**environment, 'GROQ_API_KEY': 'SYNTHETIC-ROTATED-KEY'}
                  blocked = subprocess.run([task_executable, 'install', "PYTHON=" + sys.executable, *selectors], cwd=root, env=rotated, capture_output=True, text=True)
                  assert blocked.returncode != 0 and 'FORCE=true' in blocked.stderr
                  assert (destination / 'auth.json').read_bytes() == original
                  forced = subprocess.run([task_executable, 'install', 'FORCE=true', "PYTHON=" + sys.executable, *selectors], cwd=root, env=rotated, check=True, capture_output=True, text=True)
                  assert 'SYNTHETIC-ROTATED-KEY' not in forced.stdout + forced.stderr
                  assert json.loads((destination / 'auth.json').read_text(encoding='utf-8'))['groq']['key'] == 'SYNTHETIC-ROTATED-KEY'
                  assert next(destination.glob('auth.json.credenvoy-backup-*')).read_bytes() == original
              assert not (root / 'profiles.json').exists()

              # Subscription wins over an API key on a fake installed Codex CLI.
              subscription_bin = root / 'subscription-bin'
              subscription_bin.mkdir()
              codex = subscription_bin / ('codex.cmd' if os.name == 'nt' else 'codex')
              codex.write_text('@exit /b 0\n' if os.name == 'nt' else '#!/bin/sh\nexit 0\n', encoding='utf-8')
              codex.chmod(0o700)
              native = {'tokens': {'access_token': 'SYNTHETIC-ACCESS', 'refresh_token': 'SYNTHETIC-REFRESH', 'id_token': 'SYNTHETIC-ID'}}
              environment = {**minimal, 'PATH': str(subscription_bin), 'CODEX_HOME': str(root.resolve() / 'subscription-codex'), 'OPENAI_API_KEY': 'SYNTHETIC-API', 'CODEX_AUTH_JSON': json.dumps(native)}
              result = subprocess.run([task_executable, 'install', "PYTHON=" + sys.executable], cwd=root, env=environment, check=True, capture_output=True, text=True)
              assert 'Selected codex/openai-chatgpt/subscription' in result.stdout
              installed = json.loads((root / 'subscription-codex/auth.json').read_text(encoding='utf-8'))
              assert installed == native and 'OPENAI_API_KEY' not in installed
              assert 'SYNTHETIC-API' not in result.stdout + result.stderr

      - name: Check generated examples for drift
        run: task examples:check

