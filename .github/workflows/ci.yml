name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Verify the portable Taskfiles in isolation
        shell: python
        run: |
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary)
              shutil.copyfile('Taskfile.yml', root / 'Taskfile.yml')
              shutil.copytree('tasks', root / 'tasks')
              subprocess.run(['task', 'check'], cwd=root, check=True)
              result = subprocess.run(
                  ['task', 'matrix'], cwd=root, check=True,
                  capture_output=True, text=True,
              )
              matrix = json.loads(result.stdout)
              assert matrix['provider_count'] == 44
              assert matrix['agent_count'] == 6
              assert len(matrix['cells']) == 288

              # Exercise the public installation tasks with a synthetic native home.
              native_home = root.resolve() / 'native-pi'
              environment = {
                  **os.environ,
                  'PI_CODING_AGENT_DIR': str(native_home),
                  'GROQ_API_KEY': 'SYNTHETIC-CI-KEY',
                  'AGENT_CONFIG_SPEC': json.dumps({'profiles': [{
                      'name': 'ci-pi', 'agent': 'pi', 'provider': 'groq',
                      'auth': 'api_key', 'model': 'synthetic-model',
                  }]}),
              }
              environment.pop('AGENTCFG_PROFILE', None)
              for action in ('install:plan', 'install'):
                  result = subprocess.run(
                      ['task', action], cwd=root, env=environment,
                      check=True, capture_output=True, text=True,
                  )
                  assert 'SYNTHETIC-CI-KEY' not in result.stdout + result.stderr
                  if action == 'install:plan':
                      assert not native_home.exists()
              auth = json.loads((native_home / 'auth.json').read_text(encoding='utf-8'))
              assert auth['groq']['key'] == 'SYNTHETIC-CI-KEY'
              assert not (root / 'generated').exists()

      - name: Check generated examples for drift
        run: task examples:check

