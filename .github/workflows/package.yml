name: Source bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Validate and package tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Validate source
        run: |
          task check
          task examples:check
      - name: Create a source-only archive
        run: git archive --format=zip --prefix=credenvoy/ --output=credenvoy.zip HEAD
      - name: Retain source bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credenvoy-source
          path: credenvoy.zip
          if-no-files-found: error
          retention-days: 14
